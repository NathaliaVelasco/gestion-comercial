/* Plan: informe claro tipo papel, verde oscuro Solventum para títulos, verde de marca para la salida, gris verdoso para la entrada.
   Una columna de lectura de 900 px que se imprime en carta. */
:root{--night:#01332B;--brand:#05DD4D;--brand-d:#0A9A3C;--teal:#19A591;--entry:#9DB3AC;--paper:#FFFFFF;--bg:#F3F6F4;--ink:#13221F;--muted:#5F6B68;--line:#DDE5E2;--gold:#C9A227;--bad:#C2412D;
  --f:"Solve Pro","Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
h1,h2,h3{font-weight:600;margin:0;text-wrap:balance;color:var(--night)}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--night);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.bar img{height:20px}
.bar .t{flex:1;font-weight:600;min-width:160px}
.bar button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:99px;padding:6px 12px;font-size:13px}
.bar button.pri{background:var(--brand);color:var(--night);border-color:var(--brand);font-weight:600}
.bar button.on{background:#fff;color:var(--night)}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.sheet{background:var(--paper);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:28px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:16px;margin-bottom:22px}
.head .lp{height:46px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-d)}
.head h1{font-size:28px;margin-top:4px}
.head p{margin:4px 0 0;color:var(--muted)}
.lead{font-size:17px;margin:0 0 18px}
.lead b{color:var(--night)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:26px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .n{font-size:28px;font-weight:600;color:var(--night);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.up .n{color:var(--brand-d)}
section{margin-top:26px;break-inside:avoid}
section h2{font-size:19px}
section .sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{font-family:var(--f)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td img{width:30px;height:30px;vertical-align:middle;margin-right:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.2);vertical-align:-1px}
.pos{color:var(--brand-d);font-weight:600}.neg{color:var(--bad);font-weight:600}
.pins{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pin{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.pin img{width:56px;height:56px;object-fit:contain}
.pin .v{font-family:var(--mono);font-size:10px;color:var(--muted)}
.pin .t{font-size:12px;font-weight:600;color:var(--night);min-height:32px}
.pin .p{font-size:22px;font-weight:600;color:var(--brand-d);font-variant-numeric:tabular-nums}
.pin .s{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.scroll{overflow-x:auto}
/* acceso */
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:16px;padding:26px;box-shadow:0 6px 30px rgba(0,0,0,.1)}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0}
.btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--brand);color:var(--night);font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--night);margin-top:8px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(1,31,26,.55);display:grid;place-items:center;z-index:9;padding:16px}
.modal .box{background:#fff;border-radius:14px;padding:22px;max-width:400px;width:100%}
.modal input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.hidden{display:none!important}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#FFF3D1;color:#7A5B00}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.pins{grid-template-columns:repeat(3,1fr)}.sheet{padding:18px}.head{flex-direction:column}}
@media print{
  @page{size:letter;margin:14mm}
  body{background:#fff;font-size:12px}
  .bar,.noprint,.modal{display:none!important}
  .wrap{max-width:none;padding:0}
  .sheet{box-shadow:none;padding:0;border-radius:0}
  section{break-inside:avoid}
  .brk{break-before:page}

/* cálculo */
function calc(D){
  const P=D.map(p=>{const ent=(p.entrada||[]),sal=(p.salida||[]),vag=(p.vagones||[]);
    const e=ent.filter(x=>x.ok).length*2,s=sal.filter(x=>x.ok).length*2,v=vag.reduce((a,x)=>a+x.ind+x.grp+x.puz,0);
    const ins=vag.filter(x=>x.ind===4&&x.ind+x.grp+x.puz>=8).length;
    return{...p,e,s,v,total:e+s+v,ins,hasE:ent.length>0,hasS:sal.length>0}});
  const withE=P.filter(p=>p.hasE),withS=P.filter(p=>p.hasS),both=P.filter(p=>p.hasE&&p.hasS);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const tema=TEMAS.map((t,k)=>{const pe=withE.map(p=>p.entrada.find(x=>x.q===k)).filter(Boolean),ps=withS.map(p=>p.salida.find(x=>x.q===k)).filter(Boolean);
    return{t,e:pe.length?pe.filter(x=>x.ok).length/pe.length:0,s:ps.length?ps.filter(x=>x.ok).length/ps.length:0}});
  const vag=VAGONES.map((t,k)=>{const rows=P.map(p=>(p.vagones||[]).find(x=>x.v===k+1)).filter(Boolean);
    return{t,n:rows.length,won:rows.filter(x=>x.ind===4&&x.ind+x.grp+x.puz>=8).length,ind:avg(rows.map(x=>x.ind)),grp:avg(rows.map(x=>x.grp)),puz:avg(rows.map(x=>x.puz))}});
  const grp=GROUPS.map((g,i)=>{const m=P.filter(p=>p.grupo===i);return{g,n:m.length,e:avg(m.filter(p=>p.hasE).map(p=>p.e)),s:avg(m.filter(p=>p.hasS).map(p=>p.s)),total:avg(m.map(p=>p.total)),ins:avg(m.map(p=>p.ins))}}).filter(x=>x.n);
  return{P,n:P.length,eAvg:avg(withE.map(p=>p.e)),sAvg:avg(withS.map(p=>p.s)),mejora:avg(both.map(p=>p.s-p.e)),tot:avg(P.map(p=>p.total)),ins:P.reduce((a,p)=>a+p.ins,0),tema,vag,grp,both:both.length,
    mejoraron:both.filter(p=>p.s>p.e).length};
}

function temaChart(tema){
  const W=840,row=34,top=10,left=190,right=70,H=top+tema.length*row+24,sx=v=>left+(W-left-right)*v;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Aciertos por tema en la entrada y en la salida">`;
  [0,.25,.5,.75,1].forEach(v=>g+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${top-4}" y2="${H-22}" stroke="#E6ECEA"/><text x="${sx(v)}" y="${H-6}" font-size="11" fill="#5F6B68" text-anchor="middle">${v*100} %</text>`);
  tema.forEach((t,i)=>{const y=top+i*row,d=Math.round((t.s-t.e)*100);
    g+=`<text x="${left-10}" y="${y+17}" font-size="13" fill="#13221F" text-anchor="end">${t.t}</text>
    <rect x="${left}" y="${y+3}" width="${Math.max(2,sx(t.e)-left)}" height="10" rx="3" fill="#9DB3AC"/>

  return g+"</svg>";
}

async function cargar(){
  if(ejemplo){datos=ejemploData();render();return}
  try{const r=await rpc("resultados",{p_clave:clave});if(r&&r.error==="clave"){salir("La clave no es correcta.");return}datos=r||[];render()}
  catch(e){$("#rep").innerHTML=`<p class="err">No se pudo conectar con la base de datos. Revisa la conexión y pulsa Actualizar.</p>`}
}
function salir(msg){clave=null;ss.set("expreso_clave",null);$("#app").classList.add("hidden");$("#login").classList.remove("hidden");$("#lerr").textContent=msg||""}
function entrar(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#bEj").classList.toggle("on",ejemplo);
  ["bKey","bDel"].forEach(id=>$("#"+id).classList.toggle("hidden",!clave));cargar()}
$("#lf").onsubmit=async e=>{e.preventDefault();const c=$("#clave").value.trim();$("#lerr").textContent="Verificando…";
  try{const r=await rpc("resultados",{p_clave:c});if(r&&r.error==="clave"){$("#lerr").textContent="La clave no es correcta.";return}
    clave=c;ss.set("expreso_clave",c);ejemplo=false;datos=r||[];entrar()}catch(err){$("#lerr").textContent="No se pudo conectar. Intenta de nuevo."}};
$("#demoBtn").onclick=()=>{ejemplo=true;entrar()};
$("#bRef").onclick=cargar;
$("#bEj").onclick=()=>{if(!clave){return}ejemplo=!ejemplo;$("#bEj").classList.toggle("on",ejemplo);cargar()};
$("#bPdf").onclick=()=>{try{window.print()}catch(e){}};
function modal(html){$("#mbox").innerHTML=html;$("#modal").classList.remove("hidden")}
function cerrar(){$("#modal").classList.add("hidden")}
$("#bKey").onclick=()=>{modal(`<h2 style="font-size:18px">Cambiar clave</h2><label class="note" for="nk">Nueva clave (mínimo 10 caracteres)</label><input id="nk" type="password" autocomplete="new-password"><div class="err" id="kerr"></div><div class="row2"><button class="btn ghost" id="kc">Cancelar</button><button class="btn" id="ko">Guardar</button></div>`);
  $("#kc").onclick=cerrar;$("#ko").onclick=async()=>{const n=$("#nk").value;if(n.length<10){$("#kerr").textContent="Usa al menos 10 caracteres.";return}
    const ok=await rpc("cambiar_clave",{p_clave:clave,p_nueva:n}).catch(()=>false);if(ok){clave=n;ss.set("expreso_clave",n);cerrar()}else $("#kerr").textContent="No se pudo cambiar la clave."}};
$("#bDel").onclick=()=>{modal(`<h2 style="font-size:18px">Borrar todos los datos</h2><p class="note">Se eliminan todos los participantes y sus respuestas, por ejemplo después de las pruebas y antes del evento. No se puede deshacer. Escribe BORRAR para confirmar.</p><input id="dk" autocomplete="off"><div class="err" id="derr"></div><div class="row2"><button class="btn ghost" id="dc">Cancelar</button><button class="btn" id="do" style="background:#C2412D;color:#fff">Borrar</button></div>`);
  $("#dc").onclick=cerrar;$("#do").onclick=async()=>{if($("#dk").value.trim()!=="BORRAR"){$("#derr").textContent="Escribe BORRAR para confirmar.";return}
    const ok=await rpc("borrar_datos",{p_clave:clave}).catch(()=>false);if(ok){cerrar();ejemplo=false;cargar()}else $("#derr").textContent="No se pudo borrar."}};
if(/[?&]ejemplo\b/.test(location.search)){ejemplo=true;entrar()}else if(clave)entrar();else $("#login").classList.remove("hidden");
setInterval(()=>{if(!$("#app").classList.contains("hidden")&&!ejemplo&&clave)cargar()},30000);
</script>
</body>
</html>
